name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-test'
      - 'v[0-9]+.[0-9]+.[0-9]+-release'

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Validate tag + extract version
  # ─────────────────────────────────────────
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      group: ${{ steps.version.outputs.group }}
      is_test: ${{ steps.version.outputs.is_test }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-test|-release)?$ ]]; then
            echo "❌ Invalid tag format: '$TAG'"
            echo "Expected: v1.2.3 or v1.2.3-test or v1.2.3-release"
            exit 1
          fi
          echo "✅ Tag format valid: $TAG"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"

          # Strip v prefix and suffix to get clean version
          VERSION_NAME=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*//')

          # Parse major/minor/patch for version code
          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          # Determine track
          if [[ "$TAG" == *"-test"* ]]; then
            GROUP="testers"
            IS_TEST="true"
          else
            GROUP="production"
            IS_TEST="false"
          fi

          echo "tag=$TAG"                     >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME"   >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE"   >> "$GITHUB_OUTPUT"
          echo "group=$GROUP"                 >> "$GITHUB_OUTPUT"
          echo "is_test=$IS_TEST"             >> "$GITHUB_OUTPUT"

          echo "✅ Tag: $TAG"
          echo "✅ Version: $VERSION_NAME ($VERSION_CODE)"
          echo "✅ Track: $GROUP"

  # ─────────────────────────────────────────
  # JOB 2 — Lint
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lint-report
          path: app/build/reports/lint-results-release.html

  # ─────────────────────────────────────────
  # JOB 3 — Unit Tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-report
          path: app/build/reports/tests/

  # ─────────────────────────────────────────
  # JOB 4 — Build
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: [ validate, lint, test ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/weathermind.jks

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace
        env:
          CI: "true"
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

  # ─────────────────────────────────────────
  # JOB 5 — Firebase Distribution
  # ─────────────────────────────────────────
  distribute:
    name: 🔥 Firebase Distribution
    runs-on: ubuntu-latest
    needs: [ validate, build ]

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ needs.validate.outputs.group }}
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            Version ${{ needs.validate.outputs.version_name }} (${{ needs.validate.outputs.version_code }})
            Tag: ${{ needs.validate.outputs.tag }}
            Track: ${{ needs.validate.outputs.group }}

  # ─────────────────────────────────────────
  # JOB 6 — GitHub Release (skipped for -test tags)
  # ─────────────────────────────────────────
  github-release:
    name: 📦 GitHub Release
    runs-on: ubuntu-latest
    needs: [ validate, build, distribute ]
    # Skip entirely for -test tags — only production releases get a GitHub Release
    if: needs.validate.outputs.is_test == 'false'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "WeatherMind v${{ needs.validate.outputs.version_name }}"
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## WeatherMind ${{ needs.validate.outputs.version_name }}
            **Version code:** ${{ needs.validate.outputs.version_code }}
            **Track:** ${{ needs.validate.outputs.group }}