name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-test'
      - 'v[0-9]+.[0-9]+.[0-9]+-release'

permissions:
  contents: write

jobs:
  release:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-test|-release)?$ ]]; then
            echo "❌ Invalid tag format: '$TAG'"
            echo "Expected: v1.2.3 or v1.2.3-test or v1.2.3-release"
            exit 1
          fi
          echo "✅ Tag format valid: $TAG"

      - name: Read version from version.properties
        id: version
        run: |
          # Read version.properties
          MAJOR=$(grep VERSION_MAJOR version.properties | cut -d'=' -f2)
          MINOR=$(grep VERSION_MINOR version.properties | cut -d'=' -f2)
          PATCH=$(grep VERSION_PATCH version.properties | cut -d'=' -f2)
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Determine release track
        id: track
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-test"* ]]; then
            echo "group=testers" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "group=production" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches version.properties
        run: |
          TAG="${{ github.ref_name }}"
          # Extract version from tag (strip v prefix and suffix like -test/-release)
          TAG_VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*//')
          PROPS_VERSION="${{ steps.version.outputs.version_name }}"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "❌ Tag version '$TAG_VERSION' does not match version.properties '$PROPS_VERSION'"
            echo "Please update version.properties before tagging"
            exit 1
          fi
          echo "✅ Tag version matches version.properties: $PROPS_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/weathermind.jks

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace
        env:
          CI: true
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ steps.track.outputs.group }}
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            Version ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
            Tag: ${{ steps.track.outputs.tag }}
            Track: ${{ steps.track.outputs.group }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.track.outputs.tag }}
          name: "v${{ steps.version.outputs.version_name }}"
          prerelease: ${{ steps.track.outputs.is_prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## WeatherMind ${{ steps.version.outputs.version_name }}
            **Version code:** ${{ steps.version.outputs.version_code }}
            **Track:** ${{ steps.track.outputs.group }}
